# Platform + data: background workers, a JVM service, batch jobs, a node agent,
# and a pod that can never schedule.
apiVersion: v1
kind: Namespace
metadata:
  name: platform
  labels: { team: platform }
---
apiVersion: v1
kind: Namespace
metadata:
  name: data
  labels: { team: data }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: notification-worker
  namespace: platform
  labels: { app: notification-worker, team: platform }
spec:
  replicas: 2
  selector: { matchLabels: { app: notification-worker } }
  template:
    metadata:
      labels: { app: notification-worker, team: platform }
    spec:
      containers:
        - name: app
          image: busybox:1.36
          command: ["/bin/sh", "/demo/app.sh"]
          env:
            - { name: SERVICE, value: notification-worker }
            - { name: VERSION, value: "0.9.7" }
            - { name: PATHS, value: "/send/email /send/push /send/sms /healthz" }
          ports: [{ name: metrics, containerPort: 8080 }]
          resources:
            requests: { cpu: 10m, memory: 16Mi }
            limits: { memory: 64Mi }
          volumeMounts: [{ name: demo, mountPath: /demo }]
      volumes:
        - name: demo
          configMap: { name: demo-scripts }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: inventory-service
  namespace: platform
  labels: { app: inventory-service, team: platform }
spec:
  replicas: 1
  selector: { matchLabels: { app: inventory-service } }
  template:
    metadata:
      labels: { app: inventory-service, team: platform }
    spec:
      containers:
        - name: jvm
          image: eclipse-temurin:21-jdk
          command: ["java", "-Xmx192m", "/demo/Inventory.java"]
          resources:
            requests: { cpu: 50m, memory: 192Mi }
            limits: { memory: 384Mi }
          volumeMounts: [{ name: demo, mountPath: /demo }]
      volumes:
        - name: demo
          configMap: { name: demo-scripts }
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: log-agent
  namespace: platform
  labels: { app: log-agent, team: platform }
spec:
  selector: { matchLabels: { app: log-agent } }
  template:
    metadata:
      labels: { app: log-agent, team: platform }
    spec:
      containers:
        - name: agent
          image: busybox:1.36
          command: ["/bin/sh", "-c"]
          args:
            - |
              trap 'exit 0' TERM
              while true; do
                echo "INFO  [log-agent] shipped $((RANDOM % 900 + 100)) records to logs.acme.example in $((RANDOM % 40 + 5))ms"
                sleep 5
              done
          resources:
            requests: { cpu: 5m, memory: 8Mi }
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: nightly-report
  namespace: platform
spec:
  schedule: "*/10 * * * *"
  successfulJobsHistoryLimit: 2
  jobTemplate:
    spec:
      template:
        spec:
          restartPolicy: OnFailure
          containers:
            - name: report
              image: busybox:1.36
              command: ["/bin/sh", "-c", "echo 'INFO  [nightly-report] aggregated 48213 orders'; sleep 8; echo 'INFO  [nightly-report] report uploaded'"]
---
apiVersion: batch/v1
kind: Job
metadata:
  name: db-migrate-v42
  namespace: platform
spec:
  backoffLimit: 0
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: migrate
          image: busybox:1.36
          command: ["/bin/sh", "-c", "for m in 040_orders_index 041_add_currency 042_refund_reason; do echo \"INFO  applying $m\"; sleep 2; done; echo 'INFO  schema is up to date'"]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis-cache
  namespace: data
  labels: { app: redis-cache, team: data }
spec:
  replicas: 1
  selector: { matchLabels: { app: redis-cache } }
  template:
    metadata:
      labels: { app: redis-cache, team: data }
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          ports: [{ name: redis, containerPort: 6379 }]
          resources:
            requests: { cpu: 10m, memory: 16Mi }
            limits: { memory: 128Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: redis-cache
  namespace: data
spec:
  selector: { app: redis-cache }
  ports: [{ name: redis, port: 6379, targetPort: redis }]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: analytics-etl
  namespace: data
  labels: { app: analytics-etl, team: data }
spec:
  replicas: 1
  selector: { matchLabels: { app: analytics-etl } }
  template:
    metadata:
      labels: { app: analytics-etl, team: data }
    spec:
      containers:
        - name: spark-driver
          image: busybox:1.36
          command: ["sleep", "infinity"]
          resources:
            requests: { cpu: "48", memory: 64Gi }
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: warehouse-exports
  namespace: data
spec:
  accessModes: [ReadWriteOnce]
  resources: { requests: { storage: 5Gi } }
