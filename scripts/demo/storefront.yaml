# Storefront: the customer-facing tier — healthy web + API, one crash-looping service.
apiVersion: v1
kind: Namespace
metadata:
  name: storefront
  labels: { team: web }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web-frontend
  namespace: storefront
  labels: { app: web-frontend, team: web }
spec:
  replicas: 3
  selector: { matchLabels: { app: web-frontend } }
  template:
    metadata:
      labels: { app: web-frontend, team: web }
    spec:
      containers:
        - name: nginx
          image: nginx:1.27-alpine
          ports: [{ name: http, containerPort: 80 }]
          resources:
            requests: { cpu: 20m, memory: 32Mi }
            limits: { memory: 96Mi }
          readinessProbe:
            httpGet: { path: /, port: http }
---
apiVersion: v1
kind: Service
metadata:
  name: web-frontend
  namespace: storefront
spec:
  selector: { app: web-frontend }
  ports: [{ name: http, port: 80, targetPort: http }]
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: shop
  namespace: storefront
spec:
  rules:
    - host: shop.acme.example
      http:
        paths:
          - path: /
            pathType: Prefix
            backend: { service: { name: web-frontend, port: { name: http } } }
          - path: /api
            pathType: Prefix
            backend: { service: { name: catalog-api, port: { name: http } } }
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: web-frontend
  namespace: storefront
spec:
  minAvailable: 2
  selector: { matchLabels: { app: web-frontend } }
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: web-frontend
  namespace: storefront
spec:
  scaleTargetRef: { apiVersion: apps/v1, kind: Deployment, name: web-frontend }
  minReplicas: 3
  maxReplicas: 8
  metrics:
    - type: Resource
      resource: { name: cpu, target: { type: Utilization, averageUtilization: 70 } }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: catalog-api
  namespace: storefront
  labels: { app: catalog-api, team: web }
spec:
  replicas: 2
  selector: { matchLabels: { app: catalog-api } }
  template:
    metadata:
      labels: { app: catalog-api, team: web }
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: /metrics
    spec:
      containers:
        - name: app
          image: busybox:1.36
          command: ["/bin/sh", "/demo/app.sh"]
          env:
            - { name: SERVICE, value: catalog-api }
            - { name: VERSION, value: "1.4.0" }
            - { name: PATHS, value: "/api/v1/products /api/v1/products/{id} /api/v1/categories /healthz" }
          ports: [{ name: http, containerPort: 8080 }]
          resources:
            requests: { cpu: 10m, memory: 16Mi }
            limits: { memory: 64Mi }
          volumeMounts: [{ name: demo, mountPath: /demo }]
      volumes:
        - name: demo
          configMap: { name: demo-scripts }
---
apiVersion: v1
kind: Service
metadata:
  name: catalog-api
  namespace: storefront
spec:
  selector: { app: catalog-api }
  ports: [{ name: http, port: 8080, targetPort: http }]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cart-service
  namespace: storefront
  labels: { app: cart-service, team: web }
spec:
  replicas: 1
  selector: { matchLabels: { app: cart-service } }
  template:
    metadata:
      labels: { app: cart-service, team: web }
    spec:
      containers:
        - name: app
          image: busybox:1.36
          command: ["/bin/sh", "-c"]
          args:
            - |
              echo "INFO  [cart-service] starting, version=2.1.3"
              echo "INFO  [cart-service] connecting to redis-cache.data.svc:6379"
              sleep 4
              echo "ERROR [cart-service] redis: NOAUTH Authentication required"
              echo "ERROR [cart-service] fatal: session store unavailable, exiting"
              exit 1
          resources:
            requests: { cpu: 10m, memory: 16Mi }
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: web-frontend-config
  namespace: storefront
data:
  FEATURE_NEW_CHECKOUT: "true"
  CDN_HOST: cdn.acme.example
  SESSION_TTL: 30m
---
apiVersion: v1
kind: Secret
metadata:
  name: catalog-api-db
  namespace: storefront
type: Opaque
stringData:
  DB_USER: catalog
  DB_PASSWORD: demo-not-a-real-password
  DB_URL: postgres://catalog-db.data.svc:5432/catalog
